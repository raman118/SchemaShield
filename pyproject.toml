[project]
name = "schemashield"
version = "0.1.0"
description = "Deterministic PostgreSQL migration safety and isolated validation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pglast>=7,<9",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "docker>=7.1,<8"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/schemashield"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
markers = ["integration: requires Docker and real PostgreSQL"]
addopts = "-ra --import-mode=importlib"
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "frontend", ".checkpoints", ".runtime", ".pytest_cache", ".ruff_cache", ".security-review-*"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
